name: Deploy — Stage

on:
  push:
    branches:
      - 'phase-*'

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy API to Stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Stage
        run: railway up --service=vitauto-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGE }}

  smoke-test:
    name: Smoke Test Stage
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - name: Health check (with retries)
        run: |
          url="${{ secrets.API_URL_STAGE }}/api/health"
          for i in 1 2 3 4 5 6 7 8; do
            echo "Attempt $i / 8 — $(date -u)"
            response=$(curl -sf "$url" 2>/dev/null) && break
            echo "Not ready yet, waiting 15s..."
            sleep 15
          done
          echo "$response"
          echo "$response" | grep '"status":"ok"'
          echo "$response" | grep '"environment":"stage"'
