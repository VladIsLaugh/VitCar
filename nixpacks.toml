# Railway Nixpacks configuration for NestJS API
# pnpm is installed via Nix so it is available system-wide in all phases.

[phases.setup]
nixPkgs = ["nodejs_20", "nodePackages_latest.pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm turbo run build --filter=@vitauto/api"]

[start]
cmd = "node apps/api/dist/main.js"
