# Railway Nixpacks configuration for NestJS API
# Each entry in cmds becomes a separate Docker RUN instruction.
# Chain all commands that depend on each other into a single string.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "corepack disable && npm install -g pnpm@9.15.0 && pnpm install --frozen-lockfile",
]

[phases.build]
cmds = ["pnpm turbo run build --filter=@vitauto/api"]

[start]
cmd = "node apps/api/dist/main.js"
